# Canonical local full-stack and ordinary single-VPS production deployment.
# Cloudflare and host Nginx are the public edge; every host port is loopback-only.
name: rag-builder

x-app: &app
  env_file:
    - .env
  networks: [rag_network]

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: production
  image: rag-builder-backend:production

x-app-endpoints: &app-endpoints
  APE_DATABASE__HOST: postgres
  APE_DATABASE__PORT: "5432"
  APE_DATABASE__USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  APE_DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  APE_DATABASE__NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  APE_REDIS__HOST: redis
  APE_REDIS__PORT: "6379"
  APE_REDIS__PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  APE_MINIO__ENDPOINT: minio:9000
  APE_MINIO__ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
  APE_MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
  APE_MINIO__BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
  APE_MALWARE_SCAN__HOST: clamav
  APE_MALWARE_SCAN__PORT: "3310"

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-}
    image: rag-builder-frontend:production
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3010:80"
    networks: [rag_network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/operator/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  backend:
    <<: [*app, *backend-image]
    restart: unless-stopped
    init: true
    environment: *app-endpoints
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  worker:
    <<: [*app, *backend-image]
    restart: unless-stopped
    init: true
    environment: *app-endpoints
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command:
      - taskiq
      - worker
      - app.worker.entrypoint:broker
    logging: *default-logging

  migrate:
    <<: [*app, *backend-image]
    restart: "no"
    environment: *app-endpoints
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    logging: *default-logging

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [rag_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks: [rag_network]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio_data:/data
    networks: [rag_network]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; mc mb --ignore-existing "local/$$MINIO_BUCKET"
    networks: [rag_network]
    logging: *default-logging

  clamav:
    image: clamav/clamav:1.4.5
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [rag_network]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:

networks:
  rag_network:
    driver: bridge
