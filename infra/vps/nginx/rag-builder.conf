# Install on the host, replace hostname/certificate paths, and use Cloudflare
# Full (strict). Trust CF-Connecting-IP only when origin access is restricted.
server {
  listen 80;
  listen [::]:80;
  server_name rag-builder.example.com;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name rag-builder.example.com;

  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/rag-builder.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rag-builder.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 55m;

  # Backend routes must precede the frontend fallback. Omitting a URI from
  # proxy_pass preserves the complete incoming path.
  location /api/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_buffering off;
    add_header X-Accel-Buffering no;
  }

  location = /health { proxy_pass http://127.0.0.1:8010; }
  location /health/ { proxy_pass http://127.0.0.1:8010; }
  location = /metrics { proxy_pass http://127.0.0.1:8010; }
  location ^~ /docs { proxy_pass http://127.0.0.1:8010; }
  location = /openapi.json { proxy_pass http://127.0.0.1:8010; }

  location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
  }
}
