# Install on the host, replace hostname/certificate paths, and use Cloudflare
# Full (strict). The included file must contain only current Cloudflare CIDRs.
server {
  listen 80;
  listen [::]:80;
  server_name rag-builder.example.com;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name rag-builder.example.com;

  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/rag-builder.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rag-builder.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 55m;

  # Generated from Cloudflare's published IP ranges and refreshed during normal
  # server maintenance. Never accept CF-Connecting-IP from arbitrary clients.
  include /etc/nginx/snippets/cloudflare-realip.conf;

  # These headers apply to every backend and frontend proxy location. The API
  # port is loopback-only, so Uvicorn may trust this host Nginx hop.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Request-ID $request_id;

  # Backend routes must precede the frontend fallback. Omitting a URI from
  # proxy_pass preserves the complete incoming path.
  location /api/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    proxy_set_header X-Accel-Buffering no;
  }

  location = /health { proxy_pass http://127.0.0.1:8010; }
  location /health/ { proxy_pass http://127.0.0.1:8010; }
  location = /metrics { proxy_pass http://127.0.0.1:8010; }
  # Interactive docs are intentionally disabled in production. Routing them
  # here makes the backend's 404 authoritative rather than serving the SPA.
  location = /docs { proxy_pass http://127.0.0.1:8010; }
  location ^~ /docs/ { proxy_pass http://127.0.0.1:8010; }
  location = /openapi.json { proxy_pass http://127.0.0.1:8010; }

  location / {
    proxy_pass http://127.0.0.1:3010;
  }
}
