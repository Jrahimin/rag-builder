# Install on the host and use Cloudflare Full (strict).
server {
  listen 80;
  listen [::]:80;
  server_name api.omniaskai.com;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.omniaskai.com;

  ssl_certificate /etc/ssl/cloudflare/omniaskai.com.pem;
  ssl_certificate_key /etc/ssl/cloudflare/omniaskai.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 55m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Request-ID $request_id;

  location /api/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    proxy_set_header X-Accel-Buffering no;
  }

  location = /health { proxy_pass http://127.0.0.1:8010; }
  location /health/ { proxy_pass http://127.0.0.1:8010; }
  location = /metrics { proxy_pass http://127.0.0.1:8010; }
  location = /docs { proxy_pass http://127.0.0.1:8010; }
  location ^~ /docs/ { proxy_pass http://127.0.0.1:8010; }
  location = /openapi.json { proxy_pass http://127.0.0.1:8010; }

  location / {
    proxy_pass http://127.0.0.1:3010;
  }
}
